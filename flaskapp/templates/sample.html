<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pollutant Concentration and Wind Animation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.4.0/dist/leaflet.css" />

    <!-- Windy CSS (Optional: If Windy provides additional styles) -->
    <!-- You can include any Windy-specific CSS here if needed -->

    <style>
        /* Ensure the body and html take full height */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Windy map container */
        #windy {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0; /* Base layer */
        }

        /* Optional: Style for Leaflet map if you choose to include it separately */
        /* 
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        */

        /* Additional styling for content overlaying the map (if any) */
        /* Example: */
        /*
        .content {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 5px;
        }
        */
    </style>
</head>
<body>
    <!-- Windy Map Container -->
    <div id="windy"></div>

    <!-- Optional: Leaflet Map Container (Uncomment if needed) -->
    <!-- <div id="map"></div> -->

    <!-- Optional: Content Overlaying the Map (Uncomment and customize if needed) -->
    <!--
    <div class="content">
        <h2>Pollutant Concentration and Wind Animation</h2>
        <p>Select a city or enter coordinates to view pollutant concentrations and wind directions.</p>
    </div>
    -->

    <!-- Include Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.4.0/dist/leaflet.js"></script>

    <!-- Include Windy API JS -->
    <script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>

    <script>
        // Windy API Initialization Options
        const options = {
            // Required: Your Windy API key
            key: 'DHnqHp6YzeueWA6uhkK3cxT8USF5QsuX', // Your Windy API key

            // Optional: Enable verbose console output for debugging
            verbose: true,

            // Optional: Initial state of the map
            lat: 50.4,    // Latitude for the initial center
            lon: 14.3,    // Longitude for the initial center
            zoom: 5,      // Initial zoom level
        };

        // Initialize Windy API
        windyInit(options, windyAPI => {
            // windyAPI is ready and contains 'map', 'store', 'picker', and other useful objects

            const { map } = windyAPI;
            // .map is an instance of Leaflet map

            // Example: Add a popup to the Windy map
            L.popup()
                .setLatLng([50.4, 14.3]) // Coordinates for the popup
                .setContent('Hello World') // Content of the popup
                .openOn(map);
        });
    </script>
</body>
</html>
